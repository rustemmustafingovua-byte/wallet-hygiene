name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack
        run: npm pack
      - name: Publish release with the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | head -60)"
          [ -z "$NOTES" ] && NOTES="Release $TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" || true
          gh release upload "$TAG" ./*.tgz --clobber
